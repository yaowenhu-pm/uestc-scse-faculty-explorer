<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="检索电子科技大学计算机科学与工程学院教师的研究方向与公开证据。">
  <meta name="theme-color" content="#ffffff">
  <title>教师目录 · 电子科技大学计算机科学与工程学院</title>
  <link rel="stylesheet" href="./styles.css?v=full-list-v1">
<style>
.github-source { display: inline-flex; align-items: center; justify-content: center; flex: 0 0 auto; width: 44px; height: 44px; box-sizing: border-box; color: inherit; border-radius: 8px; vertical-align: middle; text-decoration: none; }
.github-source:hover { opacity: .7; }
.github-source:focus-visible { outline: 2px solid currentColor; outline-offset: 3px; }
.github-source svg { display: block; flex: none; }
.github-source-floating { position: fixed; z-index: 1100; right: max(16px, env(safe-area-inset-right)); bottom: max(16px, env(safe-area-inset-bottom)); color: #fff; background: #24292f; border: 1px solid #ffffff40; box-shadow: 0 2px 8px #0002; }
</style>
</head>
<body>
  <a class="skip-link" href="#explore">跳转到教师检索</a>
  <header class="topbar">
    <a class="brand" href="./" aria-label="教师目录首页"><small>电子科技大学</small><strong>计算机科学与工程学院</strong></a>
    <nav aria-label="主导航">
      <a class="nav-active" href="#explore" aria-current="page">教师目录</a>
      <a href="https://www.scse.uestc.edu.cn/js_sz.jsp?urltype=tree.TreeTempUrl&amp;wbtreeid=1081" target="_blank" rel="noreferrer">学院官网 <span aria-hidden="true">↗</span></a>
    <a class="github-source" href="https://github.com/yaowenhu-pm/uestc-scse-faculty-explorer" target="_blank" rel="noopener noreferrer" aria-label="在 GitHub 查看项目源码（新标签页）" title="GitHub · 项目源码"><svg viewBox="0 0 16 16" width="20" height="20" fill="currentColor" aria-hidden="true"><path d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82A7.65 7.65 0 0 1 8 3.86c.68 0 1.36.09 2 .27 1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.01 8.01 0 0 0 16 8c0-4.42-3.58-8-8-8Z"/></svg></a></nav>
  </header>
  <main id="explore" class="page-shell">
    <div class="directory-toolbar">
      <div class="results-heading"><h1 id="results-title" tabindex="-1">教师目录</h1><span id="result-count" role="status" aria-live="polite">正在加载…</span></div>
      <div class="search-controls" role="search" aria-label="检索教师">
        <label class="search-field">
          <span class="sr-only">搜索姓名或研究方向</span>
          <input id="search" type="search" placeholder="搜索姓名或研究方向" autocomplete="off">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m21 21-4.35-4.35m2.35-5.65a8 8 0 1 1-16 0 8 8 0 0 1 16 0Z"/></svg>
        </label>
        <label class="select-field"><span class="sr-only">按职称筛选</span><select id="title"><option value="">全部职称</option></select></label>
        <label class="select-field"><span class="sr-only">按证据等级筛选</span><select id="grade"><option value="">证据等级</option><option value="S">S 级</option><option value="A">A 级</option><option value="B">B 级</option><option value="C">C 级</option><option value="D">D 级</option><option value="E">E 级</option></select></label>
      </div>
    </div>
    <div class="department-row">
      <div id="department-filter" class="department-filter" role="group" aria-label="按院系筛选"></div>
      <label class="sort-field"><span class="sr-only">排序方式</span><select id="sort"><option value="score">按等级排序 ↓</option><option value="name">按姓名排序</option><option value="directory">按学院目录</option></select></label>
    </div>
    <div class="filter-feedback"><div id="active-filters" class="active-filters" aria-label="当前筛选条件" hidden></div><button id="reset-filters" class="text-button" type="button" hidden>清空筛选</button></div>
    <div id="faculty-grid" class="faculty-grid" aria-busy="true"><div class="loading-state">正在载入教师资料…</div></div>
    <noscript><p class="empty-state">请启用 JavaScript 以搜索教师，或访问<a href="https://www.scse.uestc.edu.cn/js_sz.jsp?urltype=tree.TreeTempUrl&amp;wbtreeid=1081">学院官网</a>。</p></noscript>
  </main>
  <footer class="site-footer"><a href="https://www.scse.uestc.edu.cn/js_sz.jsp?urltype=tree.TreeTempUrl&amp;wbtreeid=1081" target="_blank" rel="noreferrer">来源：学院官网</a><a href="./methodology.html">等级仅反映公开证据</a></footer>
  <dialog id="faculty-dialog" aria-labelledby="dialog-name"><button id="dialog-close" class="dialog-close" aria-label="关闭详情" type="button">×</button><div id="dialog-content"></div></dialog>
  <template id="empty-template"><div class="empty-state"><strong>没有找到匹配的教师</strong><p>试试其他关键词，或清空筛选。</p><button class="button secondary" type="button" data-reset>清空筛选</button></div></template>
  <script type="module" src="./app.js?v=full-list-v1"></script>
</body>
</html>
